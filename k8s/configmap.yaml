# === FILE: k8s/configmap.yaml ===

apiVersion: v1
kind: ConfigMap
metadata:
  name: mnemos-config
  namespace: mnemos
data:
  AUTH_ENABLED: "false"
  BACKEND_PORT: "8000"
  JWT_EXPIRY_HOURS: "72"
  REDIS_URL: "redis://mnemos-redis:6379"
  CORS_ORIGINS: '["*"]'
  GEMINI_MODEL: "gemini-2.5-flash"
  GROQ_MODEL: "llama-3.3-70b-versatile"
  EMBEDDING_DIM: "768"
  SIMILARITY_THRESHOLD: "0.65"
  ROUTE_CONFIDENCE: "0.75"
  SHEET_WIDTH: "800"
  SHEET_MARGIN: "40"
  CARD_W: "720"
  CARD_H: "200"
  CARD_GAP: "60"
  MAX_VERSION_GAP: "50"
  OPS_RETENTION: "200"
  STREAM_DELAY: "0.02"