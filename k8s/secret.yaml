# === FILE: k8s/secret.yaml ===
# ⚠️  SECURITY WARNING: ADD THIS TO .gitignore — NEVER commit real values to version control

# Kubernetes API version for Secret resource
apiVersion: v1
# Resource type: Secret (stores sensitive data)
kind: Secret
# Metadata for the Secret
metadata:
  # Name of this Secret
  name: mnemos-secrets
  # Kubernetes namespace where this Secret exists
  namespace: mnemos
# Secret type (Opaque = unstructured binary or plaintext data)
type: Opaque
# Sensitive data (base64 encoded by Kubernetes automatically)
stringData:
  # Supabase database URL for PostgreSQL connection
  SUPABASE_URL: "https://xxx.supabase.co"
  # Supabase API key for client authentication
  SUPABASE_KEY: "eyJxxx"
  # Supabase service role key for backend operations
  SUPABASE_SERVICE_ROLE_KEY: ""
  # Google Gemini API key for LLM access
  GEMINI_API_KEY: "AIzaxxx"
  # Groq API key for alternative LLM provider
  GROQ_API_KEY: "gsk_xxx"
  # Google OAuth client ID for authentication
  GOOGLE_CLIENT_ID: "xxx.apps.googleusercontent.com"
  # JWT signing secret for token generation (generate with: openssl rand -hex 32)
  JWT_SECRET: "REPLACE-run-openssl-rand-hex-32"