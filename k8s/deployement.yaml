# === FILE: k8s/deployment.yaml ===

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnemos-backend
  namespace: mnemos
  labels:
    app: mnemos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mnemos-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mnemos-backend
    spec:
      containers:
        - name: backend
          image: YOUR_DOCKERHUB_USERNAME/mnemos-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mnemos-secrets
          env:
            - name: AUTH_ENABLED
              value: "false"
            - name: CORS_ORIGINS
              value: '["*"]'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
      # Schedule on worker node
      tolerations: []