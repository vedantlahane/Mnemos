# === FILE: k8s/redis.yaml ===
# Simple single-pod Redis for caching (no persistence needed)

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnemos-redis
  namespace: mnemos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mnemos-redis
  template:
    metadata:
      labels:
        app: mnemos-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mnemos-redis
  namespace: mnemos
spec:
  selector:
    app: mnemos-redis
  ports:
    - port: 6379
      targetPort: 6379