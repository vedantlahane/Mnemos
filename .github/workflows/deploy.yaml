# === FILE: .github/workflows/deploy.yaml ===

name: Build & Deploy Mnemos

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'k8s/**'
      - '.github/workflows/**'

  # Manual trigger button in GitHub UI
  workflow_dispatch:

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mnemos-backend

jobs:
  # ─────────────────────────────────
  # Job 1: Test
  # ─────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: backend
        env:
          # Dummy values so config doesn't crash on import
          SUPABASE_URL: "https://fake.supabase.co"
          SUPABASE_KEY: "fake-key"
          GEMINI_API_KEY: "fake-key"
        run: |
          python -m pytest test_measure.py -v --tb=short

  # ─────────────────────────────────
  # Job 2: Build & Push Docker Image
  # ─────────────────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "version=${SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHA}"

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest

  # ─────────────────────────────────
  # Job 3: Deploy to K8s
  # ─────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag in manifests
        run: |
          TAG=${{ needs.build.outputs.image_tag }}
          sed -i "s|YOUR_DOCKERHUB_USERNAME/mnemos-backend:latest|${{ env.DOCKER_IMAGE }}:${TAG}|g" k8s/deployment.yaml
          echo "Deploying image: ${{ env.DOCKER_IMAGE }}:${TAG}"
          cat k8s/deployment.yaml | grep "image:"

      - name: Copy manifests to master
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MASTER_HOST }}
          username: ${{ secrets.MASTER_USER }}
          key: ${{ secrets.MASTER_SSH_KEY }}
          source: "k8s/deployment.yaml,k8s/service.yaml,k8s/redis.yaml,k8s/namespace.yaml"
          target: "/tmp/mnemos-deploy"

      - name: Deploy to cluster
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MASTER_HOST }}
          username: ${{ secrets.MASTER_USER }}
          key: ${{ secrets.MASTER_SSH_KEY }}
          script: |
            cd /tmp/mnemos-deploy

            # Create namespace if not exists
            kubectl apply -f k8s/namespace.yaml

            # Deploy Redis (idempotent)
            kubectl apply -f k8s/redis.yaml

            # Deploy backend
            kubectl apply -f k8s/deployment.yaml
            kubectl apply -f k8s/service.yaml

            # Wait for rollout
            kubectl rollout status deployment/mnemos-backend \
              -n mnemos --timeout=120s

            # Show status
            echo "=== Pods ==="
            kubectl get pods -n mnemos -o wide
            echo "=== Services ==="
            kubectl get svc -n mnemos